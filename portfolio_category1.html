<footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>

  <script src="https://unpkg.com/imagesloaded@4/imagesloaded.pkgd.min.js" defer></script>
  <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js" defer></script>

  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      // Lightbox 設定 - 確保在 DOMContentLoaded 事件中執行
      lightbox.option({
        resizeDuration: 200,
        wrapAround: true,
        disableScrolling: true,
        showImageNumberLabel: true,
        fadeDuration: 300,
        imageFadeDuration: 300
      });
      // 新增：監聽 Lightbox 事件來控制滾動
      document.addEventListener('lightbox_opened', function() {
          document.body.classList.add('no-scroll');
      });
      document.addEventListener('lightbox_closed', function() {
          document.body.classList.remove('no-scroll');
      });


      // Masonry 初始化
      const grid = document.querySelector('.grid');
      if (grid) {
        imagesLoaded(grid, () => {
          new Masonry(grid, {
            itemSelector: '.grid-item',
            columnWidth: '.grid-item',
            gutter: 10,
            percentPosition: true
          });
        });
      }

      // 鎖住分頁標題
      const originalTitle = document.title;
      const titleEl = document.querySelector('title');
      if (titleEl) {
        const titleObserver = new MutationObserver(() => {
          if (document.title !== originalTitle) {
            document.title = originalTitle;
          }
        });
        titleObserver.observe(titleEl, { childList: true });
      }

      
      // ****************************************************************************************

      // 讓 hero-text 浮現的 JavaScript (這段也應該在 DOMContentLoaded 內部)
      const heroText = document.querySelector('.hero-text');
      if (heroText) {
        setTimeout(() => {
          heroText.classList.add('fade-in');
        }, 500); // 這裡設定 500 毫秒 (0.5 秒) 的延遲
      }
      
    }); // <--- DOMContentLoaded 事件監聽器的結束括號，確保所有相關腳本都在此之前
  </script>
</body>
</html>
